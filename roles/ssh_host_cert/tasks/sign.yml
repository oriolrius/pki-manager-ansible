---
# Sign the host public key via the PKI Manager REST API (on the controller),
# using the collection module. Only the public key is sent. The initial
# Idempotency-Key is keyed on host+fingerprint so re-runs return the same cert;
# the ANS-04 renewal job rotates a period bucket into its own key.
- name: Sign the host certificate via the PKI Manager API
  oriolrius.pki_manager.pki_manager:
    action: ssh_sign_host
    api_url: "{{ ssh_host_cert_api_v1 }}"
    validate_certs: "{{ ssh_host_cert_validate_certs }}"
    fleet_token: "{{ ssh_ca_fleet_token }}"
    host_fqdn: "{{ ansible_fqdn }}"
    host_pubkey: "{{ ssh_host_cert_keydata.public_key }}"
    host_addresses: "{{ ansible_all_ipv4_addresses }}"
    idempotency_key: "{{ inventory_hostname }}-{{ ssh_host_cert_keydata.fingerprint }}"
  register: ssh_host_cert_signed
  delegate_to: localhost
  become: false
  changed_when: false  # the cert-install copy below detects real change
  no_log: true  # contains the bearer token

# The server-side host id — used to fetch the authoritative sshd drop-in (ANS-03).
- name: Record the server-side host id
  ansible.builtin.set_fact:
    ssh_host_cert_host_id: "{{ ssh_host_cert_signed.host_id }}"

- name: Install the signed host certificate on the node
  ansible.builtin.copy:
    content: "{{ ssh_host_cert_signed.cert_openssh }}\n"
    dest: "{{ ssh_host_cert_cert_path }}"
    owner: root
    group: root
    mode: "0444"
  become: true
  notify:
    - Reload sshd
    - Reload sshd (SIGHUP)
