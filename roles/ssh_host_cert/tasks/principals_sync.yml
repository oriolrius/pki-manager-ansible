---
# Fetch this host's rendered auth_principals (fleet token) and install each
# account file. Included by principals.yml and again by principals_ack.yml when
# the backend answers 409 SHA256_MISMATCH (mappings changed after the fetch).
- name: Fetch this host's rendered auth_principals (fleet-token, ANS-01)
  oriolrius.pki_manager.pki_manager:
    action: ssh_get_principals
    api_url: "{{ ssh_host_cert_api_v1 }}"
    validate_certs: "{{ ssh_host_cert_validate_certs }}"
    fleet_token: "{{ ssh_ca_fleet_token }}"
    host_fqdn: "{{ ansible_fqdn }}"
  register: ssh_host_cert_principals
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true  # contains the bearer token

- name: Install per-account principal files
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "{{ ssh_host_cert_auth_principals_dir }}/{{ item.key }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  register: ssh_host_cert_principals_install
  loop: "{{ ssh_host_cert_principals.auth_principals.files | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
