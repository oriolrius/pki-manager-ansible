---
# Lint, sanity and integration tests of the oriolrius.pki_manager collection.
# The integration job runs a throwaway PKI Manager (tests/integration/run.sh):
# the module against the real API, then both roles twice on an Ubuntu container
# (the second run must change nothing).
name: CI

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ansible-lint + yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the linters
        run: python -m pip install --quiet "ansible-lint==25.11.1" "yamllint==1.37.1"
      - name: Install the collection dependencies
        run: ansible-galaxy collection install community.crypto community.docker
      - name: yamllint
        run: yamllint -c .yamllint .
      - name: ansible-lint
        run: ansible-lint

  sanity:
    name: ansible-test sanity (${{ matrix.ansible }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible: [stable-2.17, stable-2.18, stable-2.19]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          path: ansible_collections/oriolrius/pki_manager
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ansible-core ${{ matrix.ansible }}
        env:
          ANSIBLE_BRANCH: ${{ matrix.ansible }}
        run: python -m pip install --quiet "https://github.com/ansible/ansible/archive/${ANSIBLE_BRANCH}.tar.gz"
      - name: ansible-test sanity
        working-directory: ansible_collections/oriolrius/pki_manager
        run: ansible-test sanity --requirements --python 3.12 --color

  integration:
    name: integration (PKI Manager ${{ matrix.pki }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pki: ["3.19.0"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          path: ansible_collections/oriolrius/pki_manager
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ansible-core and the collection dependencies
        run: |
          python -m pip install --quiet "ansible-core>=2.19,<2.20"
          ansible-galaxy collection install community.crypto community.docker
      - name: Run the integration tests
        working-directory: ansible_collections/oriolrius/pki_manager
        env:
          PKI_IMAGE_TAG: ${{ matrix.pki }}
        run: tests/integration/run.sh
